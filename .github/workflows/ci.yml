name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      # mirrors `make lint`
      - run: cargo fmt --check
      - run: cargo clippy --locked --release -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # debug profile: llama.cpp still compiles, but no LTO link — tests are
      # pure logic, they never load a model
      - run: cargo test --locked

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: Metal is llama.cpp's upstream default — no features.
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bin: snap
          # Portable CPU dispatch: snap + libggml-cpu-*.so shipped together.
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: snap
            features: dynamic-backends
          # Single-file alternative: AVX2 baseline (x86-64-v3, ~2013+ CPUs).
          - name: linux-x86_64-v3
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: snap
            rustflags: -C target-cpu=x86-64-v3
          # aarch64: baseline armv8-a is slow; all-variants dispatch instead.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: snap
            features: dynamic-backends
          # Fully static single file; AVX2 baseline since dynamic backends
          # would defeat the static point. relocation-model=static → non-PIE:
          # musl static-pie mis-relocates llama.cpp's C++ .init_array pointers
          # (SIGSEGV calling a file-offset address in a BuiltinRule ctor).
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            bin: snap
            musl: true
            # bootlin ships libstdc++.so — rustc's -Wl,-Bdynamic -lstdc++ adds
            # it as DT_NEEDED into a binary with no interp (crash at init), and
            # under -static it's a hard error, so the toolchain step deletes it.
            # The trailing -lc re-scans libc.a after the last -lstdc++ — rustc
            # emits one after -lc, so libstdc++.a's members need libc revisited.
            rustflags: -C target-cpu=x86-64-v3 -C relocation-model=static -C link-arg=-Wl,-Bstatic -C link-arg=-lc
          # GPU driver path — build only, runners have no Vulkan device.
          - name: linux-x86_64-vulkan
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: snap
            features: vulkan
            vulkan: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: snap.exe
            features: dynamic-backends
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.name }}

      - name: musl cross toolchain
        if: matrix.musl
        run: |
          # musl.cc blackholes the runners' IPs (connect timeout on v4+v6);
          # bootlin's musl toolchain is a drop-in gcc+g++ replacement.
          # rustc detects a musl-capable linker by the tool's file name, so
          # expose the x86_64-linux-* tools as x86_64-linux-musl-* via symlinks.
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 \
            https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64/tarballs/x86-64--musl--stable-2024.05-1.tar.xz \
            | sudo tar xJ -C /opt
          TC=/opt/x86-64--musl--stable-2024.05-1
          # hide the shared libstdc++: rustc's -Wl,-Bdynamic -lstdc++ would
          # pick it → "attempted static link of dynamic object". -static-libstdc++
          # only rewrites the driver's implicit -lstdc++, not an explicit one.
          sudo find "$TC" -name 'libstdc++.so*' -delete
          # wrapper scripts, not symlinks: bootlin's gcc is itself a wrapper
          # that resolves <argv0>.br_real — symlinking breaks that lookup
          sudo mkdir -p /opt/musl-alias
          for t in gcc g++ ar ranlib; do
            printf '#!/bin/sh\nexec %s/bin/x86_64-linux-%s "$@"\n' "$TC" "$t" \
              | sudo tee "/opt/musl-alias/x86_64-linux-musl-$t" >/dev/null
            sudo chmod +x "/opt/musl-alias/x86_64-linux-musl-$t"
          done
          echo "/opt/musl-alias" >> "$GITHUB_PATH"
          {
            echo "CC=x86_64-linux-musl-gcc"
            echo "CXX=x86_64-linux-musl-g++"
            echo "AR=x86_64-linux-musl-ar"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=x86_64-linux-musl-gcc"
          } >> "$GITHUB_ENV"

      - name: vulkan headers + shader compiler
        if: matrix.vulkan
        run: |
          sudo apt-get update
          # spirv-headers: ggml-vulkan does find_package(SPIRV-Headers)
          sudo apt-get install -y libvulkan-dev glslang-tools spirv-tools spirv-headers
          sudo apt-get install -y glslc || true  # name varies by distro; glslangValidator is the fallback

      # llama.cpp's armv9.2 cpu variant compiles with -march=...+sme, which
      # ubuntu-24.04's default gcc-13 rejects — it needs gcc-14.
      - name: gcc-14 for armv9.2 +sme
        if: matrix.name == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
          } >> "$GITHUB_ENV"

      - name: build
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          args=(--locked --release --target "${{ matrix.target }}")
          [ -n "$FEATURES" ] && args+=(--features "$FEATURES")
          cargo build "${args[@]}"

      - name: package artifact
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          strip "${{ matrix.bin }}" 2>/dev/null || true
          files=("${{ matrix.bin }}")
          shopt -s nullglob
          files+=(libggml* libllama* *.dll)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # stdout/stdin instead of -f <path>: GNU tar parses "D:\..." as
          # host:path, and bsdtar (macOS) lacks --force-local
          tar czf - "${files[@]}" > "$GITHUB_WORKSPACE/dist/snap-${{ matrix.name }}.tar.gz"
          tar tzf - < "$GITHUB_WORKSPACE/dist/snap-${{ matrix.name }}.tar.gz"

      - name: verify packaged binary starts
        shell: bash
        run: |
          tmp=$(mktemp -d)
          tar xzf "dist/snap-${{ matrix.name }}.tar.gz" -C "$tmp"
          "$tmp/${{ matrix.bin }}" --help >/dev/null
          "$tmp/${{ matrix.bin }}" models >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.name }}
          path: dist/snap-${{ matrix.name }}.tar.gz
          retention-days: 14

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.os }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.os }}-minicpm5-2b-v1
          restore-keys: hf-${{ matrix.os }}-
      - name: build
        env:
          # runners have AVX2; also exercises the rustflags -> ggml flag path
          RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-C target-cpu=x86-64-v3' || '' }}
        run: cargo build --locked --release
      - name: run smoke.json via -p (downloads ~1.5 GB model on cache miss)
        run: ./target/release/snap -p eval/smoke.json
      - name: models + check CLI sanity
        run: |
          ./target/release/snap models
          ./target/release/snap --help >/dev/null
